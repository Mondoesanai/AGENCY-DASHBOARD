<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Inspiring Websites — Portfolio</title>
<link rel="icon" href="/brand/crown-white.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1311; --surface:#1a221e; --surface2:#232d28; --ink:#f6f9f6;
    --muted:#c2ccc5; --faint:#93a099; --line:#3a463f;
    --green:#46a878; --green-br:#77dbaa; --green-soft:#1e3a2d;
    --pos:#77dbaa; --neg:#f0906f; --warn:#eab54a;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 36px rgba(0,0,0,.4);
    --radius:14px;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 "Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-0.02em;margin:0;}
  a{color:var(--green-br);}
  button{font:inherit;cursor:pointer;}
  input,textarea,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
  input::placeholder,textarea::placeholder{color:var(--faint);}
  input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}
  code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:.9em;}

  .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 110px;}

  /* unlock bar */
  .unlock{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:18px;font-size:13px;color:var(--muted);}
  .unlock.ok{color:var(--green-br);}
  .unlock input{flex:1;max-width:280px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;}
  .unlock .link{background:none;border:none;color:var(--faint);text-decoration:underline;padding:0;font-size:12px;}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px;}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand img{width:38px;height:38px;object-fit:contain;}
  .brand .bt b{font-size:13px;letter-spacing:2.6px;font-weight:600;display:block;}
  .brand .bt span{color:var(--muted);font-size:12px;}
  .brand img{filter:drop-shadow(0 0 1px rgba(255,255,255,.4));}
  .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px;}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);}
  .pill.warn .dot{background:var(--warn);}

  .btn{border:1px solid var(--green);background:var(--green);color:#04120c;border-radius:10px;padding:9px 15px;font-weight:600;font-size:13px;transition:transform .14s cubic-bezier(.2,.9,.3,1.2),box-shadow .14s ease,filter .14s ease;box-shadow:0 2px 12px rgba(61,153,104,.28);}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.08);}
  .btn:active{transform:translateY(0);}
  .btn:focus-visible{outline:2px solid var(--green-br);outline-offset:2px;}
  .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none;}
  .btn.ghost:hover{background:var(--surface2);}
  .btn.sm{padding:7px 12px;font-size:12.5px;}
  .btn.danger{background:none;border-color:var(--neg);color:var(--neg);box-shadow:none;}
  .btn[disabled]{opacity:.5;pointer-events:none;}

  .attention{background:rgba(216,161,58,.1);border:1px solid rgba(216,161,58,.35);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px;}

  .overview{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:30px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 15px 14px;}
  .stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .stat .v{font-family:"Fraunces",serif;font-size:25px;font-weight:600;margin-top:6px;}
  .stat .d{font-size:12.5px;margin-top:3px;color:var(--faint);}
  .up{color:var(--pos);} .down{color:var(--neg);}

  .section-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px;}
  .section-h h2{font-size:17px;} .section-h span{color:var(--faint);font-size:13px;}

  .sites{display:grid;gap:11px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.7fr 46px .9fr .9fr .6fr 88px auto;align-items:center;gap:16px;text-align:left;width:100%;border-left:3px solid transparent;transition:transform .14s cubic-bezier(.2,.9,.3,1.2),border-color .14s ease;color:var(--ink);}
  .card:hover{transform:translateY(-2px);border-left-color:var(--green);}
  .card:focus-visible{outline:2px solid var(--green-br);outline-offset:2px;}
  .card .name{font-weight:600;font-size:15px;}
  .card .url{color:var(--muted);font-size:12.5px;word-break:break-all;}
  .card .cell-k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .card .cell-v{font-size:15px;font-weight:600;font-family:"Fraunces",serif;}
  .card .cell-v small{font-family:"Inter",sans-serif;font-size:11px;font-weight:500;margin-left:5px;}
  .grade{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:600;font-size:18px;background:var(--green-soft);color:var(--green-br);}
  .grade.c{background:#2c2a17;color:var(--warn);} .grade.d,.grade.f{background:#2e1a15;color:var(--neg);}
  .grade.na{background:var(--surface2);color:var(--faint);font-size:12px;}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--green-soft);color:var(--green-br);font-weight:500;}
  .chip.zero{background:var(--surface2);color:var(--faint);}
  .tag{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:2px;}
  .tag.auto{color:var(--green-br);background:var(--green-soft);}
  .tag.bill{color:var(--warn);background:#2c2a17;}
  .spark{display:block;}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;backdrop-filter:blur(2px);}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(580px,96vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .drawer-in{padding:24px 26px 70px;}
  .drawer h2{font-size:20px;} .drawer .url{color:var(--faint);font-size:13px;margin-top:2px;}
  .x{position:absolute;top:16px;right:18px;border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:9px;color:var(--muted);}
  .x:hover{color:var(--ink);}

  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;}
  .mgrid .box{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;}
  .mgrid .box .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .mgrid .box .v{font-family:"Fraunces",serif;font-size:19px;font-weight:600;margin-top:4px;}

  .block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;}
  .block h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);font-family:"Inter",sans-serif;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .block h3 .ang{font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--faint);text-align:right;}

  .bar-row{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:10px;font-size:13px;margin:7px 0;}
  .bar-track{background:var(--surface2);border-radius:6px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-br));border-radius:6px;}
  .bar-row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}

  .finding{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
  .finding:first-of-type{border-top:0;}
  .sev{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 0;text-align:center;border-radius:6px;height:fit-content;}
  .sev.high{background:#2e1a15;color:var(--neg);} .sev.med{background:#2c2a17;color:var(--warn);}
  .sev.low{background:var(--surface2);color:var(--muted);} .sev.good{background:var(--green-soft);color:var(--green-br);}
  .finding .ft{font-weight:600;font-size:14px;} .finding .fd{font-size:13px;color:var(--muted);margin-top:2px;}
  .more{background:none;border:none;color:var(--green-br);font-size:13px;padding:8px 0 0;}

  .win{display:flex;gap:9px;font-size:13.5px;padding:5px 0;}
  .win::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green-br);margin-top:7px;flex:none;}

  .field{display:block;margin:9px 0;}
  .field span{display:block;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .field input,.field textarea,.field select{width:100%;font-size:14px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);}
  .field textarea{min-height:80px;resize:vertical;}
  .field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin:10px 0;}
  .toggle input{width:16px;height:16px;accent-color:var(--green);}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px;}
  .email-draft{white-space:pre-wrap;font-size:13px;line-height:1.65;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:13px;margin-top:10px;}
  .card-thumb{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px;display:block;}
  .loading{color:var(--faint);padding:60px 0;text-align:center;}
  details.log summary{cursor:pointer;color:var(--muted);font-size:13px;}
  .logitem{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);color:var(--muted);}
  .logitem button{background:none;border:none;color:var(--faint);cursor:pointer;}

  /* modal */
  .modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.6);z-index:60;padding:6vh 16px;backdrop-filter:blur(3px);overflow-y:auto;}
  .modal.open{display:flex;}
  .modal-in{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(460px,100%);box-shadow:var(--shadow);}
  .modal-in h2{font-size:18px;margin-bottom:4px;}

  @media(max-width:1000px){.overview{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:820px){
    .overview{grid-template-columns:repeat(2,1fr);}
    .card{grid-template-columns:1fr auto;row-gap:10px;}
    .card .spark,.card .col-hide{display:none;}
    .mgrid{grid-template-columns:repeat(2,1fr);}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="unlock" id="unlock"></div>

  <header class="top">
    <div class="brand">
      <img src="/brand/crown-white.png" alt="" />
      <div class="bt"><b>INSPIRING WEBSITES</b><span>Client portfolio &amp; monthly reports</span></div>
    </div>
    <div class="top-actions">
      <span class="pill" id="statusPill"><span class="dot"></span><span id="statusTxt">loading</span></span>
      <span class="pill" id="monthPill">—</span>
      <button class="btn ghost" id="refreshBtn">Refresh</button>
      <button class="btn" id="addBtn">+ Add site</button>
      <button class="btn ghost" id="genBtn">Generate all</button>
    </div>
  </header>

  <div class="attention" id="attention" hidden></div>
  <div class="overview" id="overview"></div>

  <div class="section-h"><h2>Sites</h2><span id="siteCount"></span></div>
  <div class="sites" id="sites"><div class="loading">Loading portfolio…</div></div>
  <p class="note" id="footNote"></p>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="x" id="drawerX" aria-label="Close">✕</button>
  <div class="drawer-in" id="drawerIn"></div>
</aside>

<div class="modal" id="modal">
  <div class="modal-in">
    <h2>Add a site</h2>
    <p class="note" style="margin-top:0">Paste the live link. Everything else is optional and editable later.</p>
    <label class="field"><span>Live URL *</span><input id="m_url" placeholder="https://client-site.vercel.app" /></label>
    <div class="row2">
      <label class="field"><span>Business name</span><input id="m_name" placeholder="Acme Co." /></label>
      <label class="field"><span>Client first name</span><input id="m_client" placeholder="Kyle" /></label>
    </div>
    <div class="row2">
      <label class="field"><span>Client email</span><input id="m_email" type="email" placeholder="kyle@acme.com" /></label>
      <label class="field"><span>Phone</span><input id="m_phone" placeholder="(555) 123-4567" /></label>
    </div>
    <div class="row2">
      <label class="field"><span>$ / month</span><input id="m_price" inputmode="decimal" placeholder="150" /></label>
      <label class="field"><span>Billing day (1–28)</span><input id="m_bday" inputmode="numeric" placeholder="14" /></label>
    </div>
    <label class="toggle"><input type="checkbox" id="m_auto" /> Auto-send the monthly report email on the billing day</label>
    <div class="btn-row">
      <button class="btn" id="m_save">Add site</button>
      <button class="btn ghost" id="m_cancel">Cancel</button>
    </div>
    <p class="note" id="m_msg"></p>
  </div>
</div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=(n)=> n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : String(Math.round(n||0));
const money=(n)=>'$'+Math.round(n||0).toLocaleString('en-US');
const deltaHTML=(d)=>{ if(d==null) return ''; const c=d>0?'up':d<0?'down':''; const s=d>0?'▲':d<0?'▼':'·'; return `<small class="${c}">${s} ${Math.abs(d)}%</small>`; };

/* ---------- admin key (persisted) ---------- */
function key(){ try{ return localStorage.getItem('iw_secret')||''; }catch{ return ''; } }
function setKey(v){ try{ v?localStorage.setItem('iw_secret',v):localStorage.removeItem('iw_secret'); }catch{} renderUnlock(); }
function needKey(){
  const k=key();
  if(k) return k;
  const v=prompt('Enter your admin key (CRON_SECRET from Vercel):');
  if(v) setKey(v);
  return v;
}
function renderUnlock(){
  const el=$('#unlock');
  if(key()){
    el.className='unlock ok';
    el.innerHTML=`🔓 Admin unlocked on this device <button class="link" id="lockBtn">lock</button>`;
    $('#lockBtn').onclick=()=>setKey('');
  } else {
    el.className='unlock';
    el.innerHTML=`🔒 Locked — paste your admin key once to manage sites, notes &amp; reports
      <input id="ukInput" type="password" placeholder="CRON_SECRET" />
      <button class="btn sm" id="ukBtn">Unlock</button>`;
    $('#ukBtn').onclick=()=>{ const v=$('#ukInput').value.trim(); if(v) setKey(v); };
    $('#ukInput').onkeydown=(e)=>{ if(e.key==='Enter'){ const v=e.target.value.trim(); if(v) setKey(v); } };
  }
}

/* ---------- sparkline ---------- */
function sparkline(data,w=84,h=30){
  const arr=(data&&data.length?data:[0,0]).slice();
  const max=Math.max(...arr,1);
  const step=w/Math.max(arr.length-1,1);
  const pts=arr.map((v,i)=>`${(i*step).toFixed(1)},${(h-(v/max)*(h-4)-2).toFixed(1)}`);
  const d='M'+pts.join(' L');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d} L${w},${h} L0,${h} Z" fill="rgba(87,199,140,.12)"/>
    <path d="${d}" fill="none" stroke="#57c78c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
const trendOf=(s)=>{
  if(s.history&&s.history.length>=2) return s.history.map(h=>h.visitors||0);
  return (s.stats&&s.stats.trend)||[];
};

let STATE=null;

async function load(){
  $('#sites').innerHTML='<div class="loading">Loading portfolio…</div>';
  let data;
  try{
    const r=await fetch('/api/sites',{cache:'no-store'});
    data=await r.json();
    if(!data.sites) throw 0;
  }catch{
    $('#sites').innerHTML='<div class="loading">Could not reach the API. If this is a fresh deploy, give it a minute.</div>';
    return;
  }
  STATE=data;
  render(data);
}

function render(data){
  const p=data.portfolio;
  $('#monthPill').textContent=new Date().toLocaleString('en-US',{month:'long',year:'numeric'});
  const pill=$('#statusPill'), txt=$('#statusTxt');
  pill.className='pill'; txt.textContent='live · '+(p.backend||'ok');

  $('#overview').innerHTML=[
    ['Visitors · 30d',fmt(p.visitors30),'sites with tracking'],
    ['Conversions · 30d',fmt(p.conversions30),'calls · forms · bookings'],
    ['Avg SEO',p.avgSeo??'—','Google, mobile'],
    ['MRR',money(p.mrr),'across '+p.sites+' sites'],
    ['Improving',`${p.improving}/${p.sites}`,'vs last month'],
    ['Open suggestions',p.openFindings,'builder to-dos'],
  ].map(([k,v,d])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('');

  const att=$('#attention');
  if(p.attention&&p.attention.length){ att.hidden=false; att.textContent=`⚠ Needs attention: ${p.attention.join(', ')}`; }
  else att.hidden=true;

  $('#siteCount').textContent=`${data.sites.length} tracked`;
  if(p.auditQuota) $('#footNote').innerHTML=`Updated ${new Date(data.generatedAt).toLocaleString()}. <strong>SEO scans rate-limited</strong> — set a free <code>PAGESPEED_API_KEY</code> in Vercel.`;
  else $('#footNote').textContent=`Updated ${new Date(data.generatedAt).toLocaleString()}.`;

  $('#sites').innerHTML=data.sites.map(siteCard).join('');
  data.sites.forEach(s=>$(`[data-slug="${s.slug}"]`)?.addEventListener('click',()=>openDrawer(s.slug)));
}

function siteCard(s){
  const st=s.stats||{}, g=s.grade;
  const gl=g?g.letter:'NA';
  const seo=s.audit&&s.audit.ok?s.audit.scores.seo:null;
  return `<button class="card" data-slug="${s.slug}">
    <div>
      <div class="name">${esc(s.name)}${s.source==='auto'?'<span class="tag auto">auto</span>':''}${s.billingSoon?'<span class="tag bill">billing soon</span>':''}</div>
      <div class="url">${esc(s.url.replace(/^https?:\/\//,''))}</div>
    </div>
    <div class="grade ${gl.toLowerCase()}" title="Overall health">${g?gl:'—'}</div>
    <div class="col-hide"><div class="cell-k">Visitors 30d</div><div class="cell-v">${st.hasData?fmt(st.visitors):'—'} ${st.hasData?deltaHTML(st.deltas?.visitors):''}</div></div>
    <div class="col-hide"><div class="cell-k">Conversions</div><div class="cell-v">${st.hasData?(st.conversions??0):'—'} ${st.hasData?deltaHTML(st.deltas?.conversions):''}</div></div>
    <div class="col-hide"><div class="cell-k">SEO</div><div class="cell-v">${seo??'—'}</div></div>
    ${sparkline(trendOf(s))}
    <span class="chip ${s.openCount?'':'zero'}">${s.openCount||0} to-do${s.openCount===1?'':'s'} ›</span>
  </button>`;
}

function bars(items){
  if(!items||!items.length) return '<div class="note">No data yet.</div>';
  const max=Math.max(...items.map(i=>i.score),1);
  return items.map(i=>`<div class="bar-row"><span title="${esc(i.member)}">${esc(String(i.member).slice(0,14))}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(4,(i.score/max)*100)}%"></span></span><span class="n">${fmt(i.score)}</span></div>`).join('');
}
function histChart(hist){
  const rows=(hist||[]).slice(-8);
  if(rows.length<2) return '';
  const vals=rows.map(r=>r.visitors||0), max=Math.max(...vals,1);
  const w=100,h=44,step=w/(rows.length-1);
  const pts=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-(v/max)*(h-6)-3).toFixed(1)}`);
  const d='M'+pts.join(' L');
  return `<div class="block"><h3>Visitors by month</h3>
    <svg width="100%" height="120" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${d} L${w},${h} L0,${h} Z" fill="rgba(87,199,140,.12)"/>
      <path d="${d}" fill="none" stroke="#57c78c" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>
    <div style="display:flex;justify-content:space-between;color:var(--faint);font-size:11px">${rows.map(r=>`<span>${esc((r.month||'').slice(5))}</span>`).join('')}</div>
  </div>`;
}

/* ---------- draft email (client-side fallback) ---------- */
function buildDraft(s){
  const rep=s.report, st=s.stats||{}, g=s.grade, a=s.audit&&s.audit.ok?s.audit:null;
  const name=(($('#ecName')&&$('#ecName').value)||s.client||'there').trim();
  if(rep&&rep.email){
    let body=rep.email.body_text||rep.summary||'';
    if(name&&s.client&&name!==s.client) body=body.split(s.client).join(name);
    return {subject:rep.email.subject||`${s.name} — website update`, body};
  }
  const L=[`Hi ${name},`,'',`Quick update on your website (${s.url.replace(/^https?:\/\//,'')}):`,''];
  if(st.hasData) L.push(`• ${fmt(st.visitors)} visitors and ${st.conversions} enquiries in the last 30 days (${st.deltas.visitors>=0?'+':''}${st.deltas.visitors}% vs the month before).`);
  if(g) L.push(`• Site health score: ${g.letter} (${g.score}/100).`);
  if(a) L.push(`• SEO ${a.scores.seo}/100 and speed ${a.scores.performance}/100 (Google, mobile).`);
  L.push('','What we plan to improve next:');
  ((rep&&rep.improvements)||s.improvements||[]).slice(0,3).forEach(x=>L.push(`• ${x.title}`));
  const acts=((rep&&rep.clientActions)||s.clientActions||[]);
  if(acts.length){ L.push('','A few things that would help on your end:'); acts.slice(0,3).forEach(x=>L.push(`• ${x.title}`)); }
  L.push('','Any questions, just reply here.','','— Inspiring Websites');
  return {subject:`${s.name} — website update`, body:L.join('\n')};
}

async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json().catch(()=>({ok:false}));
}

function openDrawer(slug){
  const s=STATE.sites.find(x=>x.slug===slug); if(!s) return;
  const st=s.stats||{}, a=s.audit&&s.audit.ok?s.audit:null, g=s.grade, rep=s.report;
  const vit=a?a.vitals:null;
  const vfmt=(v,d=1)=>typeof v==='number'?(v/1000).toFixed(d)+'s':'—';
  const bf=(s.builderFindings||[]).concat((rep&&rep.builderExtra||[]).map(t=>({severity:'low',title:t,detail:''})));
  const improv=((rep&&rep.improvements&&rep.improvements.length)?rep.improvements:s.improvements)||[];
  const acts=((rep&&rep.clientActions&&rep.clientActions.length)?rep.clientActions:s.clientActions)||[];

  $('#drawerIn').innerHTML=`
    <h2>${esc(s.name)}</h2>
    <div class="url"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//,''))}</a>${s.client?' · '+esc(s.client):''}${s.priceMonthly?' · '+money(s.priceMonthly)+'/mo':''}${s.billingDay?' · bills on the '+s.billingDay:''}</div>

    <div class="mgrid">
      <div class="box"><div class="k">Visitors 30d</div><div class="v">${st.hasData?fmt(st.visitors):'—'}</div><div class="d">${st.hasData?deltaHTML(st.deltas?.visitors):'add snippet'}</div></div>
      <div class="box"><div class="k">Conversions</div><div class="v">${st.hasData?(st.conversions??0):'—'}</div><div class="d">${st.hasData?deltaHTML(st.deltas?.conversions):''}</div></div>
      <div class="box"><div class="k">Health</div><div class="v">${g?g.letter+' · '+g.score:'—'}</div></div>
      <div class="box"><div class="k">SEO</div><div class="v">${a?a.scores.seo:'—'}</div></div>
      <div class="box"><div class="k">Performance</div><div class="v">${a?a.scores.performance:'—'}</div></div>
      <div class="box"><div class="k">Accessibility</div><div class="v">${a?a.scores.accessibility:'—'}</div></div>
    </div>

    ${histChart(s.history)}

    ${a?`<div class="block"><h3>Core Web Vitals (mobile)</h3>
      <div class="bar-row" style="grid-template-columns:120px 1fr"><span>Largest paint</span><strong>${vfmt(vit.lcp)}</strong></div>
      <div class="bar-row" style="grid-template-columns:120px 1fr"><span>Layout shift</span><strong>${typeof vit.cls==='number'?vit.cls.toFixed(2):'—'}</strong></div>
      <div class="bar-row" style="grid-template-columns:120px 1fr"><span>Blocking time</span><strong>${vfmt(vit.tbt,2)}</strong></div>
    </div>`:''}

    ${st.hasData?`<div class="block"><h3>Traffic sources</h3>${bars(st.sources)}</div><div class="block"><h3>Top pages</h3>${bars(st.topPages)}</div>`:''}

    <div class="block">
      <h3>Builder suggestions <span class="ang">you only</span></h3>
      <div id="bfList">${bf.slice(0,4).map(fRow).join('')||'<div class="note">Nothing outstanding.</div>'}</div>
      ${bf.length>4?`<button class="more" id="bfMore">View all ${bf.length}</button>`:''}
    </div>

    <div class="block">
      <h3>Client suggestions <span class="ang">things the owner can do — no website work</span></h3>
      ${acts.map(x=>`<div class="finding"><span class="sev good">✓</span><div><div class="ft">${esc(x.title)}</div><div class="fd">${esc(x.why||'')}</div></div></div>`).join('')||'<div class="note">Generate a report to build these.</div>'}
    </div>

    <div class="block">
      <h3>We're improving <span class="ang">website work — for the email</span></h3>
      ${improv.map(x=>`<div class="finding"><span class="sev good">→</span><div><div class="ft">${esc(x.title)}</div><div class="fd">${esc(x.why||'')}</div></div></div>`).join('')||'<div class="note">Generate a report to build these.</div>'}
    </div>

    <div class="block">
      <h3>Monthly report ${rep?`<span class="ang">${esc(rep.month)} · ${rep.aiGenerated?'AI':'rules'}${rep.angle?' · '+esc(rep.angle):''}</span>`:''}</h3>
      ${rep?`<p style="margin:0 0 8px"><strong>${esc(rep.headline||'')}</strong></p><p style="margin:0 0 6px;color:var(--muted)">${esc(rep.summary||'')}</p>${(rep.wins||[]).map(w=>`<div class="win">${esc(w)}</div>`).join('')}`:'<div class="note">Not generated yet.</div>'}
      ${rep&&rep.reportUrl?`<p style="margin:10px 0 0"><a href="${esc(rep.reportUrl)}" target="_blank" rel="noopener">Open client report ↗</a></p>`:''}
      <img class="card-thumb" src="/api/card?slug=${encodeURIComponent(s.slug)}" alt="" loading="lazy" onerror="this.style.display='none'"/>
      <div class="btn-row"><button class="btn sm" id="genOne">${rep?'Regenerate':'Generate'} for this site</button></div>
    </div>

    <div class="block">
      <h3>Email this client</h3>
      <label class="field"><span>Client name</span><input id="ecName" value="${esc(s.client||'')}" /></label>
      <label class="field"><span>Client email</span><input id="ecAddr" type="email" value="${esc(s.email||'')}" placeholder="client@email.com" /></label>
      <div class="btn-row">
        <button class="btn sm" id="ecGmail">Open Gmail draft</button>
        <button class="btn ghost sm" id="ecCopy">Copy email text</button>
      </div>
      <p class="note">Opens Gmail with the subject + body filled in. Uses the report above if there is one.</p>
      ${rep&&rep.email?`<div class="email-draft"><strong>Subject: ${esc(rep.email.subject||'')}</strong>\n\n${esc(rep.email.body_text||'')}</div>`:''}
    </div>

    <div class="block">
      <h3>Builder notes <span class="ang">private</span></h3>
      <textarea id="notes" placeholder="Anything you want to remember about this site…">${esc(s.notes||'')}</textarea>
      <p class="note" id="notesMsg">Saves when you click away.</p>
    </div>

    <div class="block">
      <h3>What we did this month</h3>
      <div id="logList">${(s.changelog||[]).slice().reverse().map((c,i)=>logRow(c,(s.changelog.length-1-i))).join('')||'<div class="note">Nothing logged yet.</div>'}</div>
      <div class="btn-row"><input id="logInput" class="field" style="flex:1;margin:0" placeholder="e.g. Added FAQ schema, compressed hero image" /><button class="btn sm" id="logAdd">Add</button></div>
    </div>

    <details class="log block"><summary>⚙ Site settings</summary>
      <div class="row2">
        <label class="field"><span>Live URL</span><input id="cf_url" value="${esc(s.url)}" /></label>
        <label class="field"><span>Business name</span><input id="cf_name" value="${esc(s.name)}" /></label>
      </div>
      <div class="row2">
        <label class="field"><span>Client name</span><input id="cf_client" value="${esc(s.client||'')}" /></label>
        <label class="field"><span>Client email</span><input id="cf_email" value="${esc(s.email||'')}" /></label>
      </div>
      <div class="row2">
        <label class="field"><span>Phone</span><input id="cf_phone" value="${esc(s.phone||'')}" /></label>
        <label class="field"><span>$ / month</span><input id="cf_price" value="${s.priceMonthly||''}" /></label>
      </div>
      <div class="row2">
        <label class="field"><span>Billing day (1–28)</span><input id="cf_bday" value="${s.billingDay||''}" /></label>
        <label class="field"><span>Avg $ per enquiry (optional)</span><input id="cf_lead" value="${s.leadValue||''}" /></label>
      </div>
      <label class="field"><span>Google review link (optional)</span><input id="cf_review" value="${esc(s.reviewUrl||'')}" /></label>
      <label class="toggle"><input type="checkbox" id="cf_auto" ${s.autoSend?'checked':''}/> Auto-send the report email on the billing day</label>
      <div class="btn-row"><button class="btn sm" id="cfSave">Save settings</button><button class="btn danger sm" id="cfDel">Remove site</button></div>
    </details>
  `;

  wireDrawer(s,bf);
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false');
}
function fRow(f){ return `<div class="finding"><span class="sev ${f.severity}">${f.severity==='med'?'MED':f.severity}</span><div><div class="ft">${esc(f.title)}</div>${f.detail?`<div class="fd">${esc(f.detail)}</div>`:''}</div></div>`; }
function logRow(c,idx){ return `<div class="logitem"><span>${esc(c.date)} — ${esc(c.text)}</span><button data-i="${idx}">✕</button></div>`; }

function wireDrawer(s,bf){
  $('#bfMore')?.addEventListener('click',()=>{ $('#bfList').innerHTML=bf.map(fRow).join(''); $('#bfMore').remove(); });

  const addrEl=$('#ecAddr');
  $('#ecGmail').addEventListener('click',()=>{
    const addr=(addrEl.value||'').trim();
    const {subject,body}=buildDraft(s);
    const u='https://mail.google.com/mail/?view=cm&fs=1'+(addr?'&to='+encodeURIComponent(addr):'')+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    window.open(u,'_blank','noopener');
  });
  $('#ecCopy').addEventListener('click',(e)=>{ const {subject,body}=buildDraft(s); navigator.clipboard.writeText('Subject: '+subject+'\n\n'+body); e.target.textContent='Copied ✓'; setTimeout(()=>e.target.textContent='Copy email text',1500); });

  $('#genOne').addEventListener('click',async(e)=>{
    const k=needKey(); if(!k) return;
    e.target.disabled=true; e.target.textContent='Working… (up to 40s)';
    const j=await fetch(`/api/report?slug=${encodeURIComponent(s.slug)}&secret=${encodeURIComponent(k)}`,{method:'POST'}).then(r=>r.json()).catch(()=>({ok:false}));
    if(j.ok){ await load(); openDrawer(s.slug); } else { setKey(''); e.target.textContent='Failed — key?'; e.target.disabled=false; }
  });

  const nt=$('#notes');
  nt.addEventListener('blur',async()=>{
    const k=needKey(); if(!k) return;
    $('#notesMsg').textContent='Saving…';
    const j=await post(`/api/site?secret=${encodeURIComponent(k)}`,{action:'notes',slug:s.slug,notes:nt.value});
    $('#notesMsg').textContent=j.ok?'Saved.':'Save failed.';
  });

  $('#logAdd').addEventListener('click',async()=>{
    const k=needKey(); if(!k) return;
    const text=$('#logInput').value.trim(); if(!text) return;
    const j=await post(`/api/site?secret=${encodeURIComponent(k)}`,{action:'changelog-add',slug:s.slug,text});
    if(j.ok){ s.changelog=j.changelog; $('#logInput').value=''; openDrawer(s.slug); }
  });
  $('#logList').addEventListener('click',async(e)=>{
    const b=e.target.closest('button[data-i]'); if(!b) return;
    const k=needKey(); if(!k) return;
    const j=await post(`/api/site?secret=${encodeURIComponent(k)}`,{action:'changelog-del',slug:s.slug,index:+b.dataset.i});
    if(j.ok){ s.changelog=j.changelog; openDrawer(s.slug); }
  });

  $('#cfSave').addEventListener('click',async(e)=>{
    const k=needKey(); if(!k) return;
    e.target.disabled=true;
    const j=await post(`/api/site?secret=${encodeURIComponent(k)}`,{action:'save',slug:s.slug,
      url:$('#cf_url').value,name:$('#cf_name').value,client:$('#cf_client').value,email:$('#cf_email').value,
      phone:$('#cf_phone').value,priceMonthly:$('#cf_price').value,billingDay:$('#cf_bday').value,
      leadValue:$('#cf_lead').value,reviewUrl:$('#cf_review').value,autoSend:$('#cf_auto').checked});
    if(j.ok){ await load(); openDrawer(j.site.slug); } else { e.target.disabled=false; e.target.textContent='Failed'; }
  });
  $('#cfDel').addEventListener('click',async()=>{
    if(!confirm('Remove '+s.name+' from the dashboard? (the site itself is untouched)')) return;
    const k=needKey(); if(!k) return;
    const j=await post(`/api/site?secret=${encodeURIComponent(k)}`,{action:'delete',slug:s.slug});
    if(j.ok){ closeDrawer(); await load(); }
  });
}

function closeDrawer(){ $('#scrim').classList.remove('open'); $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); }
$('#scrim').addEventListener('click',closeDrawer);
$('#drawerX').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>e.key==='Escape'&&(closeDrawer(),$('#modal').classList.remove('open')));
$('#refreshBtn').addEventListener('click',load);

$('#genBtn').addEventListener('click',async()=>{
  const k=needKey(); if(!k) return;
  const b=$('#genBtn'); b.disabled=true; b.textContent='Generating all…';
  const j=await fetch(`/api/report?secret=${encodeURIComponent(k)}`,{method:'POST'}).then(r=>r.json()).catch(()=>({ok:false}));
  if(j.ok){ b.textContent=`Done · ${j.generated}`; await load(); } else { setKey(''); b.textContent='Failed — key?'; }
  setTimeout(()=>{ b.disabled=false; b.textContent='Generate all'; },2600);
});

/* ---------- add site modal ---------- */
$('#addBtn').addEventListener('click',()=>{ $('#modal').classList.add('open'); $('#m_url').focus(); });
$('#m_cancel').addEventListener('click',()=>$('#modal').classList.remove('open'));
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); });
$('#m_save').addEventListener('click',async()=>{
  const k=needKey(); if(!k) return;
  const url=$('#m_url').value.trim();
  if(!url){ $('#m_msg').textContent='Paste the live URL first.'; return; }
  $('#m_save').disabled=true; $('#m_msg').textContent='Adding…';
  const j=await post(`/api/site?secret=${encodeURIComponent(k)}`,{action:'save',
    url,name:$('#m_name').value,client:$('#m_client').value,email:$('#m_email').value,phone:$('#m_phone').value,
    priceMonthly:$('#m_price').value,billingDay:$('#m_bday').value,autoSend:$('#m_auto').checked});
  $('#m_save').disabled=false;
  if(j.ok){ ['m_url','m_name','m_client','m_email','m_phone','m_price','m_bday'].forEach(id=>$('#'+id).value=''); $('#m_auto').checked=false; $('#modal').classList.remove('open'); $('#m_msg').textContent=''; await load(); openDrawer(j.site.slug); }
  else $('#m_msg').textContent=j.error||'Failed.';
});

renderUnlock();
load();
</script>
