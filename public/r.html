<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Website Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1311; --panel:#1a221e; --panel2:#232d28; --ink:#f6f9f6; --muted:#c2ccc5;
    --faint:#93a099; --line:#3a463f; --green:#46a878; --green-br:#77dbaa; --neg:#f0906f;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font:15px/1.65 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-0.02em;margin:0;}
  .wrap{max-width:820px;margin:0 auto;padding:32px 22px 80px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:34px;height:34px;object-fit:contain;}
  .brand b{font-size:14px;letter-spacing:2.5px;font-weight:600;}
  .brand span{display:block;color:var(--faint);font-size:12px;letter-spacing:0.5px;}
  .month{color:var(--muted);font-size:14px;}
  .hero h1{font-size:30px;}
  .hero .u{color:var(--faint);font-size:13px;margin-top:4px;}
  .hero p.sum{color:var(--muted);margin:14px 0 0;font-size:15.5px;}
  .card-img{width:100%;border-radius:16px;border:1px solid var(--line);margin:24px 0;display:block;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .stat .k{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--faint);}
  .stat .v{font-family:"Fraunces",serif;font-size:26px;font-weight:600;margin-top:5px;}
  .stat .d{font-size:11.5px;margin-top:2px;color:var(--faint);}
  .up{color:var(--green-br);} .down{color:var(--neg);}
  .block{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:16px;}
  .block h3{font-size:12px;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);font-family:"Inter",sans-serif;font-weight:600;margin-bottom:12px;}
  .win{display:flex;gap:10px;padding:7px 0;font-size:14.5px;}
  .win::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green-br);margin-top:8px;flex:none;}
  .sug{padding:11px 0;border-top:1px solid var(--line);}
  .sug:first-child{border-top:0;}
  .sug .t{font-weight:600;font-size:14.5px;}
  .sug .w{color:var(--muted);font-size:13.5px;margin-top:2px;}
  .foot{margin-top:34px;color:var(--faint);font-size:12.5px;text-align:center;line-height:1.7;}
  .err{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted);}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err">Loading your report…</div></div>
<script>
const P = new URLSearchParams(location.search);
const esc = (s)=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = (n)=> n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : String(Math.round(n||0));

function deltaHTML(d,pct){
  if(d===undefined||d===null) return '';
  const cls = d>0?'up':d<0?'down':'';
  const s = d>0?'▲':d<0?'▼':'·';
  return `<span class="${cls}">${s} ${Math.abs(d)}${pct?'%':''} vs last month</span>`;
}

(async () => {
  const root = document.getElementById('root');
  try {
    const r = await fetch(`/api/public-report?slug=${encodeURIComponent(P.get('slug')||'')}&t=${encodeURIComponent(P.get('t')||'')}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'not available');

    const cur = d.current || {};
    const dv = cur.deltas ? cur.deltas.visitors : null;
    const dc = cur.deltas ? cur.deltas.conversions : null;

    root.innerHTML = `
      <div class="top">
        <div class="brand">
          <img src="/brand/crown-white.png" alt="Inspiring Websites" />
          <div><b>INSPIRING WEBSITES</b><span>Website Performance Report</span></div>
        </div>
        <div class="month">${esc(d.month)}</div>
      </div>

      <div class="hero">
        <h1>${esc(d.name)}</h1>
        <div class="u">${esc((d.url||'').replace(/^https?:\/\//,''))}</div>
        ${d.summary ? `<p class="sum">${esc(d.summary)}</p>` : ''}
      </div>

      <img class="card-img" src="${esc(d.cardUrl)}" alt="Monthly report card for ${esc(d.name)}" />

      <div class="stats">
        <div class="stat"><div class="k">Visitors · 30d</div><div class="v">${fmt(cur.visitors)}</div><div class="d">${deltaHTML(dv,true)}</div></div>
        <div class="stat"><div class="k">Enquiries</div><div class="v">${cur.conversions ?? 0}</div><div class="d">${deltaHTML(dc,false)}</div></div>
        <div class="stat"><div class="k">SEO score</div><div class="v">${d.scores ? d.scores.seo : '—'}</div><div class="d">Google, mobile</div></div>
        <div class="stat"><div class="k">Site health</div><div class="v">${d.grade ? d.grade.letter : '—'}</div><div class="d">${d.grade ? d.grade.score+' / 100' : ''}</div></div>
      </div>

      ${(d.wins&&d.wins.length) ? `<div class="block"><h3>This month</h3>${d.wins.map(w=>`<div class="win">${esc(w)}</div>`).join('')}</div>` : ''}

      ${(d.improvements&&d.improvements.length) ? `<div class="block"><h3>What we're working on next</h3>${d.improvements.map(s=>`<div class="sug"><div class="t">${esc(s.title)}</div><div class="w">${esc(s.why)}</div></div>`).join('')}</div>` : ''}

      ${(d.clientActions&&d.clientActions.length) ? `<div class="block"><h3>A few things that would help on your end</h3>${d.clientActions.map(s=>`<div class="sug"><div class="t">${esc(s.title)}</div><div class="w">${esc(s.why)}</div></div>`).join('')}</div>` : ''}

      <div class="foot">
        Prepared by <strong>Inspiring Websites</strong><br/>
        Questions about your website? Just reply to the email this came from.
      </div>
    `;
  } catch (e) {
    root.innerHTML = `<div class="err">${esc(e.message||'This report link is not valid or has expired.')}</div>`;
  }
})();
</script>
</body>
</html>
