<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Website Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1311; --panel:#1a221e; --panel2:#232d28; --ink:#f6f9f6; --muted:#c2ccc5;
    --faint:#93a099; --line:#3a463f; --green:#46a878; --green-br:#77dbaa; --neg:#f0906f;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font:15px/1.65 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-0.02em;margin:0;}
  .wrap{max-width:820px;margin:0 auto;padding:32px 22px 80px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:34px;height:34px;object-fit:contain;}
  .brand b{font-size:14px;letter-spacing:2.5px;font-weight:600;}
  .brand span{display:block;color:var(--faint);font-size:12px;letter-spacing:0.5px;}
  .month{color:var(--muted);font-size:14px;}
  .hero h1{font-size:30px;}
  .hero .u{color:var(--faint);font-size:13px;margin-top:4px;}
  .hero p.sum{color:var(--muted);margin:14px 0 0;font-size:15.5px;}
  .card-img{width:100%;border-radius:16px;border:1px solid var(--line);margin:24px 0;display:block;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .stat .k{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--faint);}
  .stat .v{font-family:"Fraunces",serif;font-size:26px;font-weight:600;margin-top:5px;}
  .stat .d{font-size:11.5px;margin-top:2px;color:var(--faint);}
  .up{color:var(--green-br);} .down{color:var(--neg);}
  .block{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:16px;}
  .block h3{font-size:12px;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);font-family:"Inter",sans-serif;font-weight:600;margin-bottom:12px;}
  .win{display:flex;gap:10px;padding:7px 0;font-size:14.5px;}
  .win::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green-br);margin-top:8px;flex:none;}
  .sug{padding:11px 0;border-top:1px solid var(--line);}
  .sug:first-child{border-top:0;}
  .sug .t{font-weight:600;font-size:14.5px;}
  .sug .w{color:var(--muted);font-size:13.5px;margin-top:2px;}
  .rk-top{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:6px;}
  .rk-big{font-family:"Fraunces",serif;font-size:44px;font-weight:600;line-height:1;}
  .rk-lbl{font-size:12px;color:var(--faint);margin-top:4px;}
  .rk-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;}
  .rk-row:first-of-type{border-top:0;}
  .rk-pos{font-weight:600;min-width:64px;text-align:right;}
  .rk-chg{font-size:12.5px;min-width:70px;text-align:right;}
  .bar{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px;}
  .bar .tr{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;}
  .bar .fi{height:100%;border-radius:99px;background:var(--green);}
  .bar .n{text-align:right;color:var(--muted);}
  .bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tgt{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:rgba(119,219,170,.14);color:var(--green-br);font-size:12.5px;font-weight:600;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .step{padding:10px 0;border-top:1px solid var(--line);}
  .step:first-child{border-top:0;}
  @media(max-width:640px){.two{grid-template-columns:1fr;}.rk-big{font-size:36px;}}
  .foot{margin-top:34px;color:var(--faint);font-size:12.5px;text-align:center;line-height:1.7;}
  .err{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted);}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err">Loading your report…</div></div>
<script>
const P = new URLSearchParams(location.search);
// works whether the URL is /r/<slug>?t=..  or  /r.html?slug=<slug>&t=..
const PATH_SLUG = (location.pathname.split('/').filter(Boolean).pop() || '').replace(/\.html$/, '');
const SLUG = P.get('slug') || (PATH_SLUG === 'r' ? '' : PATH_SLUG);
const TOK = P.get('t') || '';
const esc = (s)=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = (n)=> n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : String(Math.round(n||0));

function uptick(history,opts){
  const o=opts||{};
  const key=o.key||'visitors', title=o.title||'Visitors by month', cls=o.cls||'uptick', isPct=!!o.isPct;
  const rows=(history||[]).slice(-10).filter(h=>h&&h.month&&h[key]!=null);
  if(rows.length<2) return `<div class="block"><h3>${esc(title)}</h3><div class="w">This trend line appears here once we have a couple of months of data.</div></div>`;
  const vals=rows.map(h=>h[key]||0);
  const max=Math.max(...vals,1)*(isPct?1.05:1.18);
  const W=900,H=300,padL=10,padR=10,padT=16,padB=34;
  const iw=W-padL-padR, ih=H-padT-padB;
  const X=i=>padL+i*(iw/(rows.length-1));
  const Y=v=>padT+ih-(v/max)*ih;
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area=`${line} L${X(rows.length-1).toFixed(1)} ${padT+ih} L${padL} ${padT+ih} Z`;
  const first=vals.length>1?vals[vals.length-2]:vals[0], last=vals[vals.length-1];
  const up=last>=first;
  const col=up?'var(--green-br)':'var(--neg)';
  const pct=first?Math.round((last-first)/first*100):(last>0?100:0);
  const grid=[.25,.5,.75].map(f=>`<line x1="${padL}" y1="${(padT+ih-f*ih).toFixed(1)}" x2="${W-padR}" y2="${(padT+ih-f*ih).toFixed(1)}" stroke="var(--line)"/>`).join('');
  const labels=rows.map((r,i)=>`<text x="${X(i).toFixed(1)}" y="${H-12}" fill="var(--faint)" font-size="13" text-anchor="middle">${esc(r.month.slice(5))}</text>`).join('');
  const gid='ug-'+key;
  return `<div class="block">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h3 style="margin:0">${esc(title)}</h3>
      <span style="font-size:13px;font-weight:600;color:${col}">${pct>0?'+':''}${pct}% vs last month</span>
    </div>
    <svg class="${cls}" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px;overflow:visible">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${col}" stop-opacity="0.3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <path class="uparea" d="${area}" fill="url(#${gid})" opacity="0"/>
      <path class="upline" d="${line}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="updot" cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="6" fill="${col}" opacity="0"/>
      ${labels}
    </svg>
    <div class="upnum" data-to="${last}" style="text-align:right;font-family:Fraunces,serif;font-size:26px;font-weight:600;color:${col}">0</div>
  </div>`;
}
function initUptick(){
  document.querySelectorAll('.uptick,.uptick-health').forEach(svg=>{
  const line=svg.querySelector('.upline'); const len=line.getTotalLength();
  line.style.strokeDasharray=len; line.style.strokeDashoffset=len;
  const num=svg.parentElement.querySelector('.upnum'); const to=+(num&&num.dataset.to||0);
  const go=()=>{
    line.style.transition='stroke-dashoffset 1.4s cubic-bezier(.35,0,.15,1)'; line.style.strokeDashoffset='0';
    const ar=svg.querySelector('.uparea'); ar.style.transition='opacity .9s ease .5s'; ar.style.opacity='1';
    const dot=svg.querySelector('.updot'); dot.style.transition='opacity .3s ease 1.3s'; dot.style.opacity='1';
    if(num){ const t0=performance.now(); const tick=(t)=>{ const k=Math.min(1,(t-t0)/1300); num.textContent=Math.round(to*(1-Math.pow(1-k,3))).toLocaleString(); if(k<1)requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  };
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){ go(); io.disconnect(); }}),{threshold:0.35});
    io.observe(svg);
  } else go();
  });
}

function bigNum(n){
  n=Number(n)||0;
  if(n>=1e9) return (n/1e9).toFixed(1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'k';
  return String(Math.round(n));
}
// average position over time — lower is better, so the line is drawn flipped
// (going UP the page means moving up in Google)
function rankTrend(hist){
  const pts=(hist||[]).filter(h=>h.avgRank!=null);
  if(pts.length<2) return '';
  const W=600,H=110,pad=8;
  const vals=pts.map(p=>p.avgRank);
  const lo=Math.min(...vals), hi=Math.max(...vals), span=Math.max(hi-lo,1);
  const X=i=>pad+i*((W-pad*2)/(pts.length-1));
  const Y=v=>pad+((v-lo)/span)*(H-pad*2);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.avgRank).toFixed(1)}`).join(' ');
  const improving=vals[vals.length-1]<=vals[0];
  const col=improving?'var(--green-br)':'var(--neg)';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px;overflow:visible"><path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="5" fill="${col}"/></svg><div class="rk-lbl">Average Google position over ${pts.length} checks — ${improving?'climbing':'slipping'} (higher on this line = closer to #1)</div>`;
}
function rankBlock(d){
  const r=d.rankings;
  if(!r) return `<div class="block"><h3>Where you rank in Google</h3><div class="w">We're setting up your keyword tracking — your first rankings check lands here within a day or two, and then refreshes automatically every few days.</div></div>`;
  const checked=r.checkedAt?new Date(r.checkedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  const head = r.avgRank!=null
    ? `<div class="rk-top"><div><div class="rk-big">#${r.avgRank}</div><div class="rk-lbl">average position across ${r.found} ranking keyword${r.found===1?'':'s'}</div></div>
       <div><div class="rk-big">${r.inTop10}<span style="font-size:20px;color:var(--faint)"> / ${r.tracked}</span></div><div class="rk-lbl">keywords on page 1 (top 10)</div></div>
       ${r.bestRank?`<div><div class="rk-big">#${r.bestRank}</div><div class="rk-lbl">your best keyword</div></div>`:''}</div>`
    : `<div class="rk-top"><div><div class="rk-big">Building</div><div class="rk-lbl">not on the first ${r.depth||100} results yet for your ${r.tracked} keywords — normal for a newer site</div></div>
       ${r.indexed?`<div><div class="rk-big">${r.indexed.count}${r.indexed.count>=100?'+':''}</div><div class="rk-lbl">pages of your site Google has indexed</div></div>`:''}
       ${r.roughField?`<div><div class="rk-big">~${bigNum(r.roughField)}</div><div class="rk-lbl">results Google lists for your search terms</div></div>`:''}</div>`;
  const rows=(r.keywords||[]).map(k=>{
    let chg='<span style="color:var(--faint)">—</span>';
    if(k.change===999) chg='<span class="up">▲ new</span>';
    else if(k.change===-999) chg='<span class="down">▼ dropped</span>';
    else if(k.change>0) chg=`<span class="up">▲ ${k.change}</span>`;
    else if(k.change<0) chg=`<span class="down">▼ ${Math.abs(k.change)}</span>`;
    else if(k.change===0 && k.rank) chg='<span style="color:var(--faint)">no change</span>';
    return `<div class="rk-row"><span>${esc(k.keyword)}</span><span class="rk-pos" style="color:${k.rank&&k.rank<=10?'var(--green-br)':'var(--muted)'}">${k.rank?'#'+k.rank:'not yet'}</span><span class="rk-chg">${chg}</span></div>`;
  }).join('');
  const tl=r.timeline;
  const tlLine = tl&&tl.ok&&tl.improving&&tl.weeksToTarget
    ? `<div class="rk-lbl" style="margin-top:12px;color:var(--green-br)">At the current pace, top-3 average is roughly ${tl.weeksToTarget} week${tl.weeksToTarget===1?'':'s'} away.</div>` : '';
  return `<div class="block"><h3>Where you rank in Google</h3>${head}
    ${d.progress?`<p style="margin:14px 0 6px;color:var(--muted)">${esc(d.progress)}</p>`:''}
    ${rankTrend(r.history)}${tlLine}
    <div style="margin-top:14px">${rows}</div>
    <div class="rk-lbl" style="margin-top:10px">Checked ${esc(checked)} · rechecked automatically every few days${(r.competitors&&r.competitors.length)?` · showing up alongside: ${r.competitors.map(c=>esc(c.domain)).join(', ')}`:''}</div></div>`;
}
function barsBlock(title, items, note){
  if(!items||!items.length) return '';
  const max=Math.max(...items.map(i=>i.score),1);
  return `<div class="block"><h3>${esc(title)}</h3>${items.map(i=>`<div class="bar"><span class="nm" title="${esc(i.member)}">${esc(String(i.member).replace(/-/g,' '))}</span><span class="tr"><span class="fi" style="display:block;width:${Math.max(4,(i.score/max)*100)}%"></span></span><span class="n">${fmt(i.score)}</span></div>`).join('')}${note?`<div class="rk-lbl" style="margin-top:8px">${esc(note)}</div>`:''}</div>`;
}
function workBlock(d){
  const wd=(d.workDone||[]);
  if(wd.length) return `<div class="block"><h3>What we did for you</h3>${wd.map(w=>`<div class="step"><div class="t" style="font-weight:600;font-size:14.5px">${esc(w.title)}</div>${w.detail?`<div class="w" style="color:var(--muted);font-size:13.5px;margin-top:2px">${esc(w.detail)}</div>`:''}</div>`).join('')}</div>`;
  return '';
}
function deltaHTML(d,pct){
  if(d===undefined||d===null) return '';
  const cls = d>0?'up':d<0?'down':'';
  const s = d>0?'▲':d<0?'▼':'·';
  return `<span class="${cls}">${s} ${Math.abs(d)}${pct?'%':''} vs last month</span>`;
}

(async () => {
  const root = document.getElementById('root');
  try {
    const r = await fetch(`/api/public-report?slug=${encodeURIComponent(SLUG)}&t=${encodeURIComponent(TOK)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'not available');

    const cur = d.current || {};
    const dv = cur.deltas ? cur.deltas.visitors : null;
    const dc = cur.deltas ? cur.deltas.conversions : null;

    root.innerHTML = `
      <div class="top">
        <div class="brand">
          <img src="/brand/crown-white.png" alt="Inspiring Websites" />
          <div><b>INSPIRING WEBSITES</b><span>Website Performance Report</span></div>
        </div>
        <div class="month">${esc(d.month)}</div>
      </div>

      <div class="hero">
        <h1>${esc(d.name)}</h1>
        <div class="u">${esc((d.url||'').replace(/^https?:\/\//,''))}</div>
        ${d.summary ? `<p class="sum">${esc(d.summary)}</p>` : ''}
      </div>

      <a href="${esc(d.url)}" target="_blank" rel="noopener"><img class="card-img" style="aspect-ratio:16/9;max-height:340px;object-fit:cover;object-position:top;background:var(--panel) url('/brand/crown-white.png') center/40px no-repeat" src="/api/shot?slug=${encodeURIComponent(SLUG)}" alt="Your website" onerror="this.style.display='none'" /></a>
      ${d.ready===false?`<div class="block" style="border-color:var(--faint)"><div class="w">Your full report is being prepared — the numbers below fill in once your web team runs it.</div></div>`:''}

      ${uptick(d.history,{key:'visitors',title:'Visitors by month',cls:'uptick'})}

      ${uptick(d.history,{key:'health',title:'Site health score by month',cls:'uptick-health',isPct:true})}

      <div class="stats">
        <div class="stat"><div class="k">Visitors · 30d</div><div class="v">${fmt(cur.visitors)}</div><div class="d">${deltaHTML(dv,true)}</div></div>
        <div class="stat"><div class="k">Enquiries</div><div class="v">${cur.conversions ?? 0}</div><div class="d">${deltaHTML(dc,false)}</div></div>
        <div class="stat"><div class="k">SEO score</div><div class="v">${d.scores ? d.scores.seo : '—'}</div><div class="d">Google, mobile</div></div>
        <div class="stat"><div class="k">Site health</div><div class="v">${d.grade ? d.grade.letter : '—'}</div><div class="d">${d.grade ? d.grade.score+' / 100' : ''}</div></div>
      </div>

      ${rankBlock(d)}

      ${workBlock(d)}

      ${(d.wins&&d.wins.length) ? `<div class="block"><h3>${d.period==='biweekly'?'The last two weeks':'This month'}</h3>${d.wins.map(w=>`<div class="win">${esc(w)}</div>`).join('')}</div>` : ''}

      ${(d.recentWork&&d.recentWork.length) ? `<div class="block"><h3>Recently done</h3>${d.recentWork.map(w=>`<div class="win">${w.fromClientRequest?'<strong>You asked for this</strong> — ':''}${esc(w.text)} <span style="opacity:.6;font-size:.9em">— ${esc(w.date)}</span></div>`).join('')}</div>` : ''}

      ${(d.improvements&&d.improvements.length) ? `<div class="block"><h3>What we're working on next</h3>${d.improvements.map(s=>`<div class="sug"><div class="t">${esc(s.title)}</div><div class="w">${esc(s.why)}</div></div>`).join('')}</div>` : ''}

      ${(d.clientActions&&d.clientActions.length) ? `<div class="block"><h3>Your plan for this week</h3>${d.clientActions.map(s=>`<div class="sug"><div class="t">${esc(s.title)}</div><div class="w">${esc(s.why)}</div>${s.target?`<span class="tgt">🎯 ${esc(s.target)}</span>`:''}</div>`).join('')}<div class="rk-lbl" style="margin-top:10px">Do these and we'll show the result in your next update — it all shows up in the numbers below.</div></div>` : ''}

      ${d.traffic ? `<div class="two">${barsBlock('Where your visitors come from',d.traffic.sources,'last 30 days')}${barsBlock('Your most visited pages',d.traffic.topPages,'last 30 days')}</div>
      <div class="two">${barsBlock('What visitors did — your enquiries',d.traffic.events,'calls, bookings, form submissions and button taps')}${barsBlock('Where your enquiries came from',d.traffic.leadSources,'the channel each enquiry started from')}</div>` : ''}

      <div class="foot">
        Prepared by <strong>Inspiring Websites</strong><br/>
        Questions about your website? Just reply to the email this came from.
      </div>
    `;
    initUptick();
  } catch (e) {
    root.innerHTML = `<div class="err">${esc(e.message||'This report link is not valid or has expired.')}</div>`;
  }
})();
</script>
</body>
</html>
